name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          # macos-13 was the last Intel image with that name; GitHub retired it in Dec 2025.
          # macos-15-intel is its x86_64 replacement.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: |
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"
          sw_vers
          swiftc --version

      - name: Build universal app
        run: ./build.sh

      - name: Check both slices
        run: |
          archs=$(lipo -archs build/Wakeful.app/Contents/MacOS/Wakeful)
          echo "archs: $archs"
          for a in x86_64 arm64; do
            [[ " $archs " == *" $a "* ]] || { echo "missing $a slice"; exit 1; }
          done

      - name: Check script syntax and bundled scripts
        run: |
          for f in bin/wakeful Resources/setup-sudoers.sh install.sh build.sh; do zsh -n "$f"; done
          for f in wakeful setup-sudoers.sh; do test -x "build/Wakeful.app/Contents/Resources/$f" || { echo "$f not bundled"; exit 1; }; done

      # read-only checks; on the runner some may fail (status 1), but the binary must not crash on this arch
      - name: wakeful doctor runs
        run: |
          set +e
          WAKEFUL_APP=build/Wakeful.app zsh bin/wakeful doctor
          s=$?
          [[ $s -le 1 ]] || { echo "doctor exited with $s"; exit 1; }
